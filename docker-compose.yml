services:
  rclone-gui:
    image: rclone/rclone:latest
    container_name: rclone-web-dashboard
    restart: unless-stopped
    ports:
      - "5572:5572"
    volumes:
      - ./config:/config/rclone
      - ${NAS_DATA_DIR:-/vol1}:/data:ro,rslave
      - ./logs:/logs
    environment:
      - TZ=Asia/Taipei
    command:
      - rcd
      - --rc-web-gui
      - --rc-web-gui-no-open-browser
      - --rc-addr=0.0.0.0:5572
      - --rc-no-auth
      - --config=/config/rclone/rclone.conf

  backup-guard:
    image: rclone-backup-runner:latest
    build: .
    container_name: rclone-backup-guard
    restart: unless-stopped
    volumes:
      - ./config:/config/rclone
      - ./scripts:/app/scripts
      - ${NAS_DATA_DIR:-/vol1}:/data:ro,rslave
      - ${DOCKER_SRC_DIR:-/vol2/1000/docker}:/docker_src:ro
      - ./logs:/logs
      - ${SYSTEM_BACKUP_DIR:-/mnt/system_backup}:/mnt/system_backup:ro
    environment:
      - TZ=Asia/Taipei
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - FREE_THRESHOLD_GB=${FREE_THRESHOLD_GB:-100.0}
      - SYNC_SCHEDULE_TIME=${SYNC_SCHEDULE_TIME:-02:00}
      - BACKUP_FOLDERS=${BACKUP_FOLDERS:-}
      - SYSTEM_BACKUP_DIR=/mnt/system_backup
